services:
  postgres:
    image: postgres:16
    container_name: place_intel_postgres
    environment:
      POSTGRES_DB: place_intel
      POSTGRES_USER: place_user
      POSTGRES_PASSWORD: place_password
    ports:
      - "5433:5432"
    volumes:
      - place_intel_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U place_user -d place_intel"]
      interval: 5s
      timeout: 5s
      retries: 10

  adminer:
    image: adminer
    container_name: place_intel_adminer
    ports:
      - "8080:8080"
    depends_on:
      - postgres

  dbt-docs:
    image: python:3.12-slim
    container_name: place_intel_dbt_docs
    working_dir: /app/dbt_place_intel
    volumes:
      - .:/app
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "pip install --no-cache-dir dbt-core==1.11.9 dbt-postgres==1.10.0 &&
             dbt docs generate --profiles-dir . --target docker &&
             dbt docs serve --profiles-dir . --target docker --host 0.0.0.0 --port 8081 --no-browser"

volumes:
  place_intel_pgdata: